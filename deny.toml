# cargo-deny config (docs/11 Phase 0: "deny.toml for licences/advisories").
# Run with `cargo deny check`.

[advisories]
yanked = "deny"
ignore = [
    # proc-macro-error2, pulled in transitively by libsignal-protocol's
    # ML-KEM implementation (libcrux-ml-kem -> hax-lib-macros), is flagged
    # unmaintained, not vulnerable. No safe upgrade exists upstream; revisit
    # when libsignal updates its libcrux dependency.
    "RUSTSEC-2026-0173",
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    # hpke-rs / hpke-rs-crypto, pulled in transitively by libsignal-protocol.
    "MPL-2.0",
    # webpki-root-certs (Mozilla's root CA bundle as data, not code),
    # pulled in transitively by reqwest's rustls TLS backend (cue-core's
    # transport module, docs/06 "Transport").
    "CDLA-Permissive-2.0",
    # Cue's own crates (ADR-0008): AGPL-3.0 server, GPL-3.0 client core.
    "AGPL-3.0-or-later",
    "GPL-3.0-or-later",
    # libsignal-protocol and its internal crates (docs/03 "Implementation":
    # wrap libsignal directly rather than reimplement X3DH/the ratchet).
    "AGPL-3.0-only",
]

[bans]
wildcards = "deny"
# Our own crates are workspace path dependencies with no version (publish =
# false, see root Cargo.toml) — that's a wildcard by cargo-deny's definition
# but not the unpinned-external-dependency risk this lint exists to catch.
allow-wildcard-paths = true
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
    # libsignal-protocol (docs/03): not published to crates.io by design,
    # pinned by tag in crates/cue-crypto/Cargo.toml.
    "https://github.com/signalapp/libsignal",
    # Transitive dep of libsignal-protocol's post-quantum ratchet.
    "https://github.com/signalapp/SparsePostQuantumRatchet.git",
]
