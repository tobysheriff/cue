[package]
name = "cue-core"
description = "Client core (docs/06): sessions, ratchets, MLS, KT verification, local encrypted store, transport, padding, cover traffic. Shared by every Cue client — the UI layer never makes a cryptographic decision."
license = "GPL-3.0-or-later"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
cue-proto = { path = "../cue-proto" }
cue-crypto = { path = "../cue-crypto" }
cue-kt = { path = "../cue-kt" }
tokio = { workspace = true, features = ["net"] }
thiserror = { workspace = true }
rand = "0.9"
prost = { workspace = true }
# Onion transport (Tor via `arti`, docs/06) lands later; a plain HTTPS
# client is Phase 1's "ugly but real" bar. rustls, not the system TLS
# stack, to keep the dependency set boring and auditable (docs/05).
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
# The live half of mailbox delivery (`GET /v1/mailbox/{id}/ws`); `NodeClient::deliver`/
# `fetch_mailbox` cover the polling half. Plain `ws://` only for now, matching
# `reqwest` above — no TLS feature enabled here yet.
tokio-tungstenite = "0.29"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# The encrypted local store (docs/06 "Local storage"). `bundled-sqlcipher-vendored-openssl`
# vendors SQLCipher's *and* OpenSSL's C source and builds both from scratch — a slower
# build than linking a system libsqlcipher, but zero new system dependency and a
# reproducible build (docs/11 Phase 0), matching the same "boring, auditable" rationale
# `reqwest`/rustls above already follows rather than trusting whatever TLS/crypto stack
# happens to be on the host. Pinned to 0.33, not latest: `rusqlite` 0.40's
# `libsqlite3-sys` build script uses the still-unstable `cfg_select!` std macro and fails
# to compile on stable rustc.
rusqlite = { version = "0.33", default-features = false, features = ["bundled-sqlcipher-vendored-openssl"] }
# OS keychain access for the local store's key (docs/03: "a random key stored in the OS
# keychain" when app-lock is off — the only mode this Phase 1 slice implements). Default
# features already cover macOS Keychain, Windows Credential Manager, and Linux Secret
# Service (via `zbus`, pure Rust, no libdbus) — no extra feature selection needed. Only
# `OsKeychainKeySource` calls into this; `cargo test` never does, so CI doesn't need a
# live OS keychain or D-Bus session available.
keyring = "4"
# Explicit zeroisation of key material (docs/03 "Local storage encryption"); relied on for
# `StoreKey`, not for key material `libsignal-protocol` itself already owns.
zeroize = "1"
# `libsignal_protocol`'s store traits are themselves `#[async_trait(?Send)]` (see
# `session.rs`'s doc comment on why `Core::spawn` needs a `LocalSet`); implementing them
# for `EncryptedStore`'s sub-stores requires the same macro on the impl blocks.
async-trait = "0.1"

[dev-dependencies]
# Dev-only: proves the local store's actual point — that a session survives a process
# restart — by reopening a real file-backed store from a temp directory.
tempfile = "3"
