[package]
name = "cue-node"
description = "The Cue Node: one binary, one Postgres database, one object store (docs/05)."
license = "AGPL-3.0-or-later"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "cue-node"
path = "src/main.rs"

[dependencies]
cue-proto = { path = "../cue-proto" }
cue-crypto = { path = "../cue-crypto" }
cue-kt = { path = "../cue-kt" }
tokio = { workspace = true, features = ["net", "signal"] }
thiserror = { workspace = true }
tracing = { workspace = true }
axum = "0.8.9"
tower = "0.5.3"
hmac = "0.13.0"
sha2 = "0.11.0"
argon2 = "0.5.3"
rand = "0.9"
prost = { workspace = true }
